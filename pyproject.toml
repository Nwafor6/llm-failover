[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-failover"
version = "0.1.0"
description = "Multi-LLM provider client with automatic failover and priority ordering"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Nwafor Glory"}
]
keywords = ["llm", "ai", "openai", "anthropic", "gemini", "grok", "deepseek", "failover"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]

[project.optional-dependencies]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Nwafor6/llm-failover"
Repository = "https://github.com/Nwafor6/llm-failover"
Issues = "https://github.com/Nwafor6/llm-failover/issues"

[tool.hatch.build.targets.sdist]
include = [
    "src/llm_failover/**/*.py",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_failover"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
